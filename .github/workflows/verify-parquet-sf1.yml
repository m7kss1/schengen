name: verify-parquet-sf1

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ghcr.io/m7kss1/base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Force HTTPS for submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Mark workspace as safe git directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Init required submodules
        run: |
          git submodule update --init --depth 1 contrib/googletest

      - name: Build parquet sf1 tests
        run: |
          chmod +x .docker/build-parquet-sf1.sh
          ./.docker/build-parquet-sf1.sh "$GITHUB_WORKSPACE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-verify-parquet-sf1
          path: ${{ github.workspace }}/build-verify-parquet-sf1
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ghcr.io/m7kss1/base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Force HTTPS for submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Mark workspace as safe git directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Init required submodules
        run: |
          git submodule update --init --depth 1 contrib/googletest

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-verify-parquet-sf1
          path: ${{ github.workspace }}/build-verify-parquet-sf1

      - name: Restore execute permissions
        run: |
          chmod +x "$GITHUB_WORKSPACE/build-verify-parquet-sf1/test/table_generator_tests"

      - name: Verify parquet sf1 tables
        run: |
          chmod +x .docker/verify-parquet-sf1.sh
          ./.docker/verify-parquet-sf1.sh "$GITHUB_WORKSPACE"
