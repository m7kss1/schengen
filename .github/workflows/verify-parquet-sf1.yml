name: verify-parquet-sf1

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    container:
      image: ghcr.io/m7kss1/base:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S . \
                -B build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DUSE_SYSTEM_ARROW=ON \
                -DENABLE_FORMATS=OFF \
                -DENABLE_PARQUET=ON \
                -DENABLE_GOOGLETEST=OFF \
                -DENABLE_BENCHMARK=OFF

      - name: Build
        run: |
          cmake --build build --target schengen_core -j"$(nproc)"
          test -f build/libschengen_core.so

      - name: Verify parquet sf1 tables
        run: |
          chmod +x .docker/verify-parquet-sf1.sh
          ./.docker/verify-parquet-sf1.sh "$PWD"